name: Update gazette data

on:
  schedule:
    # Her gece 03:00 UTC (Kıbrıs saatiyle 05:00/06:00)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pymupdf

      - name: Run scraper (fresh fetch)
        run: python scraper.py --refresh

      - name: Cross-check against mevzuatkibris.com RSS
        # Yalnızca rapor üretir (Actions özetinde görünür); hiçbir zaman
        # güncellemeyi bozmaz.
        id: crosscheck
        if: always()
        continue-on-error: true
        run: python crosscheck.py

      - name: Open / update / close cross-check issue
        # Fark varsa "crosscheck" etiketli tek bir issue açar (aynı farklar
        # için tekrar yorum atmaz); farklar kapanınca issue'yu kapatır.
        if: always() && steps.crosscheck.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DIFF: ${{ steps.crosscheck.outputs.diff }}
          FP: ${{ steps.crosscheck.outputs.fingerprint }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          num=$(gh issue list --label crosscheck --state open --json number -q '.[0].number')
          if [ "$DIFF" = "true" ]; then
            printf '\n@%s · [Çalıştırma kaydı](%s)\n' "$OWNER" "$RUN_URL" >> crosscheck.md
            if [ -z "$num" ]; then
              gh label create crosscheck --color d93f0b \
                --description "mevzuatkibris.com çapraz kontrol farkı" 2>/dev/null || true
              gh issue create --label crosscheck \
                --title "Çapraz kontrol: mevzuatkibris.com ile fark bulundu" \
                --body-file crosscheck.md
            elif ! gh issue view "$num" --json body,comments \
                   -q '.body, .comments[].body' | grep -q "crosscheck-fp:$FP"; then
              gh issue comment "$num" --body-file crosscheck.md
            else
              echo "Aynı farklar zaten #$num içinde bildirildi."
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Fark kalmadı, kapatılıyor. [Çalıştırma kaydı]($RUN_URL)"
          fi

      - name: Commit & push if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data cache/pdf_dates.json
          # summary.json'daki zaman damgası her koşuda değişir; yalnızca
          # gerçek veri (decisions.json) değiştiyse commit at.
          if ! git diff --cached --quiet -- web/data/decisions.json cache/pdf_dates.json; then
            git commit -m "data: otomatik veri güncellemesi ($(date -u +%Y-%m-%d))"
            git push
            # GITHUB_TOKEN ile yapılan push, push-tetikli workflow'ları
            # çalıştırmaz; Pages dağıtımını elle tetikle.
            gh workflow run deploy-pages.yml --ref main
          else
            echo "Veri değişmedi, commit atlanıyor."
          fi
